name: Ragu audit effort comparison

on:
  workflow_dispatch:
    inputs:
      head:
        description: Pinned source head containing an independently confirmed defect
        required: true
        default: fa6aa850f40aa3b39cafdaf99e1afec7d01e1d11
      base:
        description: Pinned base used for the same comparison
        required: true
        default: f597a08e6a11b1c7f166a8d2878d46132a3fbb6f
      max-cost-usd:
        description: Estimated API budget for both core reviews combined ($1 to $25)
        required: true
        default: '10'

permissions:
  contents: read
  pull-requests: read

jobs:
  compare:
    if: github.repository == 'tachyon-zcash/ragu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ragu-audit-model
    concurrency:
      group: ragu-audit-effort-comparison
      cancel-in-progress: false
    env:
      CARGO_HOME: /tmp/ragu-audit-evaluation-cargo
      RAGU_AUDIT_MODEL: ${{ vars.RAGU_AUDIT_MODEL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned CLI and required sandbox
        run: bash qa/audit/install.sh
      - id: toolchain
        name: Read the trusted Rust toolchain
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              channel = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'channel={channel}\n')
          PY
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-23
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy,rustfmt
      - uses: ./.github/actions/rust-nightly-setup
        with:
          components: rustfmt
      - name: Store the model key outside the review sandbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 qa/audit/runner.py store-key --private "$RUNNER_TEMP/audit-evaluation-private"
      - name: Compare high and xhigh independently on the same source
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATION_HEAD: ${{ inputs.head }}
          EVALUATION_BASE: ${{ inputs.base }}
          EVALUATION_LIMIT: ${{ inputs.max-cost-usd }}
        run: |
          python3 qa/audit/compare_effort.py --root "$GITHUB_WORKSPACE" \
            --private "$RUNNER_TEMP/audit-evaluation-private" \
            --work "$RUNNER_TEMP/audit-evaluation-work" \
            --out "$RUNNER_TEMP/audit-evaluation-reports" \
            --head "$EVALUATION_HEAD" --base "$EVALUATION_BASE" --max-cost-usd "$EVALUATION_LIMIT"
      - name: Remove model credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/audit-evaluation-private"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ragu-audit-effort-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-evaluation-reports
          if-no-files-found: warn
          retention-days: 30

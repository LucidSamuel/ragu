[package]
name = "ragu_primitives"
version.workspace = true
authors.workspace = true
description = "Low-level gadgets and algorithms; intended for internal use in the Ragu project"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ragu_primitives"
categories = [
  "cryptography",
  "mathematics",
  "algorithms",
  "development-tools",
  "no-std",
]
keywords = ["cryptography", "zero-knowledge", "gadgets", "poseidon", "circuits"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[features]
alloc = []
default = ["alloc"]
std = ["ragu_core/std"]

[lib]
bench = false

[dependencies]
udon = { workspace = true }
ragu_core = { path = "../ragu_core", version = "0.0.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.12", default-features = false }

# Needed for the `Write` derive macro.
ragu_macros = { path = "../ragu_macros", version = "0.0.0" }

[dev-dependencies]
rand = { workspace = true, features = ["thread_rng"] }
gungraun = { workspace = true }
proptest = { workspace = true }
ragu_testing = { path = "../ragu_testing", version = "0.0.0" }

[[bench]]
name = "gungraun"
harness = false

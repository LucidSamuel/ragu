name: Fixtures

# Checks the golden fixtures under `crates/ragu_pcd/tests/fixtures/`. The
# `fuse fixtures` job replays the committed randomness tapes through the
# prover and requires the committed proofs and digests back, and checks that
# the verifier still accepts the committed compressed proofs. A red job means
# the fuse pipeline or the verifier changed what it produces or accepts; see
# `crates/ragu_pcd/tests/fixtures/fuse/README.md` for how to regenerate the
# fixtures when that is intended.
#
# The same tests also run inside the Rust CI matrix on every platform, which
# is what proves the fixtures platform-independent. This job is the named
# signal.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fixtures: ${{ steps.filter.outputs.fixtures }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            fixtures:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/fixtures.yml'
              - '.github/actions/**'

  fuse:
    name: fuse fixtures
    needs: changes
    if: needs.changes.outputs.fixtures == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: fixtures
      - name: Check the fuse and verifier fixtures
        run: >-
          cargo test --release -p ragu_pcd --locked --all-features
          --lib proof::fuse_fixture_tests
